<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>ASCII Donut</title>
  <style>
    :root{color-scheme:dark;--bg:#050505;--panel:#0b0b0b;--text:#d8ffd8;--muted:#75a875;--accent:#72ff72;--border:#1c371c}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 35%,rgba(40,100,40,.08),transparent 35%),var(--bg)}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;color:var(--text)}
    .terminal{width:min(920px,100%);border:1px solid var(--border);background:rgba(11,11,11,.94);box-shadow:0 20px 70px rgba(0,0,0,.55);overflow:hidden}
    .titlebar{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px}
    .dot{width:8px;height:8px;border-radius:50%;border:1px solid currentColor;opacity:.8}.title{margin-left:4px;letter-spacing:.04em}
    main{padding:clamp(24px,6vw,56px)}
    .prompt{color:var(--muted);font-size:clamp(11px,1.5vw,13px);margin-bottom:24px}.prompt::before{content:"$ ";color:var(--accent)}
    h1{margin:0 0 8px;font-size:clamp(28px,6vw,56px);line-height:1;font-weight:600;letter-spacing:-.05em}
    .sub{margin:0 0 34px;color:var(--muted);font-size:13px}
    .stage{min-height:430px;display:grid;place-items:center;border:1px solid var(--border);background:linear-gradient(rgba(114,255,114,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(114,255,114,.02) 1px,transparent 1px),var(--panel);background-size:24px 24px;overflow:auto}
    pre{margin:0;padding:24px;color:var(--accent);text-shadow:0 0 12px rgba(114,255,114,.16);font-size:clamp(6px,1.15vw,11px);line-height:1;font-weight:700;white-space:pre;user-select:none}
    .footer{margin-top:18px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:11px;flex-wrap:wrap}
    kbd{border:1px solid var(--border);padding:3px 6px;color:var(--text);background:#080808}
    @media(max-width:560px){body{padding:10px}main{padding:22px 16px}.stage{min-height:360px}pre{padding:12px;font-size:6px}}
  </style>
</head>
<body>
  <section class="terminal">
    <header class="titlebar" aria-label="terminal window">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="title">ascii-donut — running</span>
    </header>
    <main>
      <div class="prompt">node ./donut.js</div>
      <h1>ASCII DONUT</h1>
      <p class="sub">A tiny static website. One file. Zero dependencies.</p>
      <div class="stage"><pre id="donut" aria-label="spinning ASCII donut"></pre></div>
      <div class="footer"><span>press <kbd>Space</kbd> to pause / resume</span><span id="status">● spinning</span></div>
    </main>
  </section>

  <script>
    (() => {
      const canvas = document.getElementById("donut");
      const status = document.getElementById("status");
      const width = 62, height = 30;
      const chars = ".,-~:;=!*#$@";
      let A = 0, B = 0, running = true;

      function render() {
        const buffer = Array(width * height).fill(" ");
        const zBuffer = Array(width * height).fill(0);
        const sinA = Math.sin(A), cosA = Math.cos(A);
        const sinB = Math.sin(B), cosB = Math.cos(B);

        for (let theta = 0; theta < Math.PI * 2; theta += 0.07) {
          const sint = Math.sin(theta), cost = Math.cos(theta);
          for (let phi = 0; phi < Math.PI * 2; phi += 0.02) {
            const sinp = Math.sin(phi), cosp = Math.cos(phi);
            const circleX = 2 + cost, circleY = sint;

            const x = circleX * (cosB * cosp + sinA * sinB * sinp) - circleY * cosA * sinB;
            const y = circleX * (sinB * cosp - sinA * cosB * sinp) + circleY * cosA * cosB;
            const z = 5 + circleX * cosA * sinp + circleY * sinA;
            const ooz = 1 / z;
            const xp = Math.floor(width / 2 + 34 * ooz * x);
            const yp = Math.floor(height / 2 - 17 * ooz * y);
            if (xp < 0 || xp >= width || yp < 0 || yp >= height) continue;

            const idx = xp + yp * width;
            const luminance = cosp * cost * sinB - cosA * cost * sinp - sinA * sint + cosB * (cosA * sint - cost * sinA * sinp);
            if (ooz > zBuffer[idx]) {
              zBuffer[idx] = ooz;
              const ci = Math.max(0, Math.min(chars.length - 1, Math.floor((luminance + 1) * 0.5 * chars.length)));
              buffer[idx] = chars[ci];
            }
          }
        }

        let output = "";
        for (let y = 0; y < height; y++) output += buffer.slice(y * width, (y + 1) * width).join("") + "\n";
        canvas.textContent = output;
      }

      function tick() {
        if (running) { A += 0.01; B += 0.01; render(); }
        requestAnimationFrame(tick);
      }

      window.addEventListener("keydown", event => {
        if (event.code === "Space") {
          event.preventDefault();
          running = !running;
          status.textContent = running ? "● spinning" : "Ⅱ paused";
        }
      });

      render();
      tick();
    })();
  </script>
</body>
</html>
