# yaml-language-server schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  install-cert-manager:
    desc: Install cert-manager
    cmds:
      - kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml

  traefik:
    desc: Sync Traefik configuration to k3s
    cmds:
      - sudo mkdir -p /var/lib/rancher/k3s/server/manifests/
      - sudo install -m 0644 ./k3s/traefik/helmchartconfig.yml /var/lib/rancher/k3s/server/manifests/traefik-config.yml
      - sudo install -m 0644 ./k3s/registries/registries.yml /etc/rancher/k3s/registries.yaml
      - sudo systemctl restart k3s

  apply:
    desc: Sync all k3s resources
    deps:
      - traefik
    cmds:
      - kubectl apply -f k3s/cert-manager/
      - kubectl apply -f k3s/apps/
